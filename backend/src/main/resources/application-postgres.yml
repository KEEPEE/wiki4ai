server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://db:5432/wiki4ai
    username: wiki4ai
    password: wiki4ai
    driver-class-name: org.postgresql.Driver
    hikari:
      # WIKI4AI-68: explicit pool sizing. Previously implicit defaults (max 10,
      # connection-timeout 30s) applied; under sustained load (e.g. embedding backfill +
      # concurrent logins) requests queued silently for up to 30s per request-held
      # connection (OSIV is on). 20 connections give headroom; leak detection surfaces
      # long-held connections in the log instead of failing opaquely.
      maximum-pool-size: 20
      leak-detection-threshold: 60000

  # WIKI4AI-197 (REV-2 P0 #9): the H2 web console is off in the deployed profile.
  #
  # The base config turns it on for local H2 development, the postgres profile used to
  # leave it on as well, and H2 is a compile-scope dependency that ships in the jar
  # (pom.xml). So the console servlet was registered in the compose deployment too — a
  # login form that connects to whatever JDBC URL the visitor types. With
  # jdbc:postgresql://db:5432/wiki4ai and the placeholder wiki4ai/wiki4ai that was the
  # whole database; with an H2 mem URL plus CREATE ALIAS ... AS $$java$$ it is code
  # execution inside the JVM.
  #
  # The one thing standing between that and a remote visitor was H2's web-allow-others
  # loopback check, which rejects traffic arriving through a published port or a proxy.
  # Correct today, and one property away from remote code execution — a property whose
  # default has changed across H2 versions.
  #
  # Disabled here rather than in the base config: local H2 development is exactly where
  # the console is useful, and it is where the loopback check is genuinely satisfied.
  h2:
    console:
      enabled: false

  # Flyway - manages database schema migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.wiki4ai: INFO
    org.springframework.web: INFO
