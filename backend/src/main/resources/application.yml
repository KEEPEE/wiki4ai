server:
  port: 8080

spring:
  application:
    name: wiki4ai-backend
  
  servlet:
    multipart:
      # WIKI4AI-64: raised to fit image uploads (10 MB). The existing POST /upload
      # (.md documents) is unchanged in code; it now simply accepts up to the same cap.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
  
  # Default profile uses H2 for development
  datasource:
    url: jdbc:h2:mem:wiki4ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway - disabled for H2 dev mode, enabled in postgres profile
  flyway:
    enabled: false

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# CORS configuration
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://localhost:80
    - http://localhost
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type
    - X-Requested-With
    - Accept
    - Origin
    - Referer
    - Access-Control-Request-Method
    - Access-Control-Request-Headers
  allow-credentials: true
  max-age: 3600

# Logging
logging:
  level:
    com.wiki4ai: INFO
    org.springframework.web: INFO

# JWT configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 86400000  # 24 hours in ms
  refreshExpiration: 604800000  # 7 days

# Initial admin bootstrap (WIKI4AI-69) - OPTIONAL provisioning for compose-managed
# instances. NO DEFAULTS ON PURPOSE: a fresh "out of the box" instance must never
# ship with publicly known credentials (the old admin/change-me-now defaults were
# a security gap). When both values are unset, InitialAdminBootstrap skips and the
# instance starts UNINITIALIZED - the first ADMIN account is then created through
# the WebUI first-run setup flow (POST /api/v1/auth/setup). Set them explicitly
# (env ADMIN_INITIAL_USERNAME / ADMIN_INITIAL_PASSWORD) only to provision the
# admin non-interactively; they are honored only while the users table is empty.
admin:
  initial:
    username: ${ADMIN_INITIAL_USERNAME:}
    password: ${ADMIN_INITIAL_PASSWORD:}

# Public self-registration policy (WIKI4AI-70) for POST /api/v1/auth/register:
#   unset (default) - open only while no account exists yet (first-run); closes
#                     automatically once the first account is created (403 after)
#   true            - always open (explicit opt-in for self-hosters who want
#                     public sign-up on their instance)
#   false           - never open (accounts via first-run setup or admin UI only)
auth:
  registration:
    open: ${AUTH_REGISTRATION_OPEN:}

# Image upload storage (WIKI4AI-64). Host volume in the docker stack:
# /var/lib/wiki4ai/uploads -> /uploads in the backend container.
upload:
  dir: ${UPLOAD_DIR:/uploads}

# First-run documentation seed (WIKI4AI-74). On a completely fresh instance
# (users table empty AND projects table empty) startup seeds the bundled
# "wiki4ai" documentation project — 9 English documents + 11 screenshots from
# src/main/resources/seed/ — so "clone -> run" ships with full docs. Existing
# instances are never touched (the freshness condition can only hold before any
# user or project exists). Opt out with WIKI4AI_SEED_ENABLED=false.
wiki4ai:
  seed:
    enabled: ${WIKI4AI_SEED_ENABLED:true}
  # Hybrid search (WIKI4AI-90): minimum cosine similarity a vector hit must reach
  # to be fused into the hybrid result; below it, semantic candidates are dropped
  # and the query degrades to text-only (empty state becomes reachable). Default
  # 0.35 is data-driven from the dev corpus: best unrelated-query score 0.3374 vs
  # relevant-hit floor ~0.37 (see WIKI4AI-90 evidence). Set 0 to disable filtering.
  search:
    semantic-min-similarity: ${WIKI4AI_SEARCH_SEMANTIC_MIN_SIMILARITY:0.35}
  # Per-token rate limit (WIKI4AI-139). Sliding window, keyed by the token's SHA-256
  # hash — NOT by IP — so one noisy token cannot freeze its owner's other tokens.
  # Applies to hashed (w4a_) tokens only; the legacy clear-text JWT path stays
  # unthrottled on purpose (regression protection for existing clients and tests).
  # Over the limit → 429 with Retry-After. Own implementation, no new dependency,
  # no scheduler: windows are maintained lazily on write.
  rate-limit:
    requests-per-second: ${WIKI4AI_RATE_LIMIT_RPS:30}
    window-millis: ${WIKI4AI_RATE_LIMIT_WINDOW_MILLIS:1000}
  # Work items (WIKI4AI-140 az 144).
  #   lease-minutes      - how long a claim is held. AC of WIKI4AI-142: default 45.
  #                        An agent that is still working renews it with
  #                        POST /api/v1/work-items/{id}/lease.
  #   lease-sweep-millis - period of the lease reaper, the first @Scheduled task of
  #                        this project. fixedDelay: the next sweep starts one
  #                        period after the previous one FINISHED, so a slow sweep
  #                        cannot stack on itself.
  #   scheduling-enabled - the switch of @EnableScheduling (config/SchedulingConfig).
  #                        Default true: an instance that says nothing schedules.
  #                        The test profile sets it to false so that no background
  #                        thread can move a row in the shared test database between
  #                        assertions; the reaper's operation itself stays available
  #                        and is called directly by the tests that need it.
  work-items:
    lease-minutes: ${WIKI4AI_WORK_ITEMS_LEASE_MINUTES:45}
    lease-sweep-millis: ${WIKI4AI_WORK_ITEMS_LEASE_SWEEP_MILLIS:60000}
    scheduling-enabled: ${WIKI4AI_WORK_ITEMS_SCHEDULING:true}
  # Resources + reservations (WIKI4AI-155 az 157).
  #   reservation-ttl-minutes - how long a reservation holds capacity unless it is released
  #                             by hand. AC of WIKI4AI-157: an expired holding frees its
  #                             slots on its own.
  #   reaper-interval-ms      - period of the reservation TTL reaper (ReservationReaper).
  #                             fixedDelay, same as the lease sweep: a slow sweep cannot
  #                             stack on itself.
  #   scheduling-enabled      - the switch of @EnableScheduling for THIS reaper
  #                             (config/ReservationSchedulingConfig). Separate from
  #                             wiki4ai.work-items.scheduling-enabled on purpose: pausing one
  #                             reaper must not silently pause the other. Default true; the
  #                             test profile sets it false so no background thread can move a
  #                             row in the shared test database between assertions.
  resources:
    reservation-ttl-minutes: ${WIKI4AI_RESOURCES_RESERVATION_TTL_MINUTES:60}
    reaper-interval-ms: ${WIKI4AI_RESOURCES_REAPER_INTERVAL_MS:60000}
    scheduling-enabled: ${WIKI4AI_RESOURCES_SCHEDULING:true}

# Embedding sidecar (WIKI4AI-35, epic WIKI4AI-26).
# In the docker stack the service name is 'embedding' on port 8030.
# When unreachable, search degrades to text-only — never a hard failure.
embedding:
  base-url: ${EMBEDDING_BASE_URL:http://localhost:8030}
  enabled: true
  connect-timeout-ms: 2000
  read-timeout-ms: 120000
  batch-size: 4
  unavailable-ttl-ms: 15000
