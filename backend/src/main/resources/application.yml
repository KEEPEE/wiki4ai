server:
  port: 8080

spring:
  application:
    name: wiki4ai-backend
  
  servlet:
    multipart:
      # WIKI4AI-64: raised to fit image uploads (10 MB). The existing POST /upload
      # (.md documents) is unchanged in code; it now simply accepts up to the same cap.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
  
  # Default profile uses H2 for development
  datasource:
    url: jdbc:h2:mem:wiki4ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway - disabled for H2 dev mode, enabled in postgres profile
  flyway:
    enabled: false

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# CORS configuration
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://localhost:80
    - http://localhost
    - http://192.168.77.177:3000
    - http://192.168.77.177
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type
    - X-Requested-With
    - Accept
    - Origin
    - Referer
    - Access-Control-Request-Method
    - Access-Control-Request-Headers
  allow-credentials: true
  max-age: 3600

# Logging
logging:
  level:
    com.wiki4ai: INFO
    org.springframework.web: INFO

# JWT configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 86400000  # 24 hours in ms
  refreshExpiration: 604800000  # 7 days

# Initial admin bootstrap - creates first admin user when DB is empty
admin:
  initial:
    username: ${ADMIN_INITIAL_USERNAME:admin}
    password: ${ADMIN_INITIAL_PASSWORD:change-me-now}

# Image upload storage (WIKI4AI-64). Host volume in the docker stack:
# /var/lib/wiki4ai/uploads -> /uploads in the backend container.
upload:
  dir: ${UPLOAD_DIR:/uploads}

# Embedding sidecar (WIKI4AI-35, epic WIKI4AI-26).
# In the docker stack the service name is 'embedding' on port 8030.
# When unreachable, search degrades to text-only — never a hard failure.
embedding:
  base-url: ${EMBEDDING_BASE_URL:http://localhost:8030}
  enabled: true
  connect-timeout-ms: 2000
  read-timeout-ms: 120000
  batch-size: 4
  unavailable-ttl-ms: 15000
