# Test configuration - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate - create schema from entities for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway in tests (H2 in-memory DB uses Hibernate ddl-auto)
spring.flyway.enabled=false

# Disable Spring Security in test context (JWT filter not needed for @WebMvcTest)
security.enabled=false

# First-run doc seed (WIKI4AI-74): OFF by default in tests so existing integration
# contexts see the same empty-database behaviour as before. The dedicated seeder
# tests (FirstRunDocSeeder*Test) opt in explicitly via @DynamicPropertySource.
wiki4ai.seed.enabled=false

# Work item lease reaper (WIKI4AI-142): the TIMER is off in tests, the OPERATION is not.
# Every Spring context in this suite shares one named in-memory H2 (jdbc:h2:mem:testdb)
# and contexts are cached for the life of the JVM, so a scheduler started by any one of
# them would sweep that shared database on a background thread for the whole run and
# could move a row between another test's assertions - timing-dependent, therefore
# flaky. Tests call WorkItemLeaseReaper.releaseExpired() / WorkItemService
# .releaseExpiredLeases() directly, which is the same method @Scheduled calls.
# WorkItemLeaseReaperTest asserts that the @Scheduled trigger is wired to it, so the
# wiring itself is under test even though the timer is not running.
wiki4ai.work-items.scheduling-enabled=false

# Resource reservation TTL reaper (WIKI4AI-157): the TIMER is off in tests, the OPERATION is
# not. Same reason as above - one shared named H2, contexts cached for the life of the JVM.
# Tests call ReservationReaper.releaseExpired() / ResourceService.releaseExpiredReservations()
# directly, which is the very method @Scheduled calls. ReservationTtlIntegrationTest asserts
# that no internalScheduledAnnotationProcessor bean exists in the test context, i.e. that no
# @Scheduled method was registered at all. Production keeps scheduling on: application.yml
# defaults it to true and ReservationSchedulingConfig uses matchIfMissing = true.
wiki4ai.resources.scheduling-enabled=false
