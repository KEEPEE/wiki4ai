# Test-only defaults for contexts that run WITHOUT the "test" profile.
#
# Three @SpringBootTest classes in this suite do not declare @ActiveProfiles("test")
# (KdbxRealWorldTest, VaultImportServiceTest, SecurityConfigTest). They therefore get
# the main application.yml - including its defaults - and application-test.properties
# never applies to them. This file is the place where a test-only default has to be
# stated for those contexts too; it is loaded next to application.yml (different file
# name, so nothing is shadowed) and a property here wins over the same key in YAML.
#
# Work item lease reaper (WIKI4AI-142): the TIMER is off, the OPERATION is not.
# The reaper is the first @Scheduled task of this project. Spring caches a context for
# the life of the test JVM, so a scheduler started by any context keeps sweeping on a
# background thread while unrelated tests run - timing-dependent, therefore flaky.
# Tests that need a sweep call WorkItemLeaseReaper.releaseExpired() (or
# WorkItemService.releaseExpiredLeases()) directly; that is the very method the
# @Scheduled wrapper calls, and WorkItemLeaseReaperTest asserts the wiring.
# Production keeps scheduling on: application.yml defaults it to true and
# SchedulingConfig uses matchIfMissing = true.
wiki4ai.work-items.scheduling-enabled=false

# Resource reservation TTL reaper (WIKI4AI-157): the TIMER is off, the OPERATION is not.
# Same mechanism as above, a separate property on purpose - pausing one reaper must not
# silently pause the other in production. Tests call ReservationReaper.releaseExpired()
# (or ResourceService.releaseExpiredReservations()) directly.
wiki4ai.resources.scheduling-enabled=false
