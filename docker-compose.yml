services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/wiki4ai
      - SPRING_DATASOURCE_USERNAME=wiki4ai
      - SPRING_DATASOURCE_PASSWORD=wiki4ai
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    # pgvector-enabled PostgreSQL 16 (drop-in replacement for postgres:16-alpine, WIKI4AI-33)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wiki4ai
      POSTGRES_USER: wiki4ai
      POSTGRES_PASSWORD: wiki4ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki4ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
