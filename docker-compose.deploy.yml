services:
  backend:
    image: git.keepee.duckdns.org/services/wiki4ai/backend:<IMAGE_TAG>
    container_name: wiki4ai-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/wiki4ai
      - SPRING_DATASOURCE_USERNAME=wiki4ai
      - SPRING_DATASOURCE_PASSWORD=wiki4ai
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=wiki4ai-jwt-secret-key-change-in-production-secure-2025
      - EMBEDDING_BASE_URL=http://embedding:8030
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: git.keepee.duckdns.org/services/wiki4ai/frontend:<IMAGE_TAG>
    container_name: wiki4ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mcp-server:
    image: git.keepee.duckdns.org/services/wiki4ai/mcp:<IMAGE_TAG>
    container_name: wiki4ai-mcp
    ports:
      - "8095:8095"
    environment:
      - MCP_BASE_URL=http://wiki4ai-backend:8080/api
      - MCP_JWT_TOKEN=${MCP_JWT_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped

  # NOTE (WIKI4AI-34/35, epic WIKI4AI-26): the embedding sidecar service is
  # intentionally NOT part of this deploy compose — the GitLab pipeline does not
  # build/push the embedding image yet, so `docker compose up` would fail on the
  # pull. Instances that run semantic search (e.g. the dev stack on .219) add the
  # service to their local compose file; without it the backend degrades to
  # text-only search via EMBEDDING_BASE_URL probing (never a hard failure).

  db:
    # pgvector-enabled PostgreSQL 16 (drop-in replacement for postgres:16-alpine, WIKI4AI-33)
    image: pgvector/pgvector:pg16
    container_name: wiki4ai-db
    environment:
      POSTGRES_DB: wiki4ai
      POSTGRES_USER: wiki4ai
      POSTGRES_PASSWORD: wiki4ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki4ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
