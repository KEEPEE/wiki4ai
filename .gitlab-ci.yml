# wiki4ai - CI/CD Pipeline
# Build Docker images (backend + frontend) and push to GitLab Registry, then deploy to server

stages:
  - build_and_push
  - deploy-to-server

variables:
  DOCKER_BUILDKIT: "1"
  IMAGE_REGISTRY: git.keepee.duckdns.org/services/wiki4ai
  SERVER_IP: "192.168.77.177"
  SERVER_USER: "keepee"
  BACKEND_IMAGE_NAME: "backend"
  FRONTEND_IMAGE_NAME: "frontend"

# ── Build and push Docker images to GitLab Registry ────────────────────────────

build-backend:
  stage: build_and_push
  image: docker:29
  tags:
    - docker
  services:
    - docker:dind
  timeout: 60m
  script:
    - echo "Building backend Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain -t ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ./backend
    - docker tag ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-frontend:
  stage: build_and_push
  image: docker:29
  tags:
    - docker
  services:
    - docker:dind
  timeout: 60m
  script:
    - echo "Building frontend Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain -f ./frontend/Dockerfile.frontend -t ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy to server 192.168.77.177 ───────────────────────────────────────────

deploy-to-server:
  stage: deploy-to-server
  image: alpine:latest
  timeout: 30m
  needs:
    - build-backend
    - build-frontend
  script:
    - echo "Deploying to server ${SERVER_IP}..."
    - apk add --no-cache openssh-client sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${SERVER_IP} >> ~/.ssh/known_hosts
    # Create deployment directory on server
    - echo "Creating deployment directory on server..."
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "mkdir -p /home/keepee/docker/stacks/wiki4ai"
    # Replace IMAGE_TAG placeholder and transfer docker-compose.deploy.yml to server
    - echo "Transferring docker-compose.deploy.yml to server..."
    - sed "s/<IMAGE_TAG>/${CI_COMMIT_SHORT_SHA}/g" docker-compose.deploy.yml | sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "cat > /home/keepee/docker/stacks/wiki4ai/docker-compose.yml"
    # Login to GitLab registry on server and pull new images
    - echo "Logging into GitLab registry on server..."
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} git.keepee.duckdns.org"
    - echo "Pulling new backend image from GitLab registry..."
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker pull ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - echo "Tagging backend image as latest..."
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker tag ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:latest"
    - echo "Pulling new frontend image from GitLab registry..."
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker pull ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - echo "Tagging frontend image as latest..."
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker tag ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:latest"
    # Stop old containers and deploy with compose
    - echo "Stopping old containers and deploying..."
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "cd /home/keepee/docker/stacks/wiki4ai && docker compose down || true"
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "cd /home/keepee/docker/stacks/wiki4ai && docker compose up -d"
    # Check container status
    - echo "Checking container status..."
    - sshpass -p 540413 ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "cd /home/keepee/docker/stacks/wiki4ai && docker compose ps"
    - echo "Deployment completed successfully!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
