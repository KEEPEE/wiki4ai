# wiki4ai - CI/CD Pipeline
# Build Docker images (backend + frontend + mcp + embedding) and push to GitLab Registry, then deploy to the dev server

stages:
  - test
  - build_and_push
  - deploy-to-server

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_TLS_VERIFY: 1
  IMAGE_REGISTRY: git.keepee.duckdns.org/services/wiki4ai
  # WIKI4AI-52: deploy target is the real dev instance (.219, dockge stack wiki4ai).
  # Production .4 is NEVER touched by the pipeline — explicit user decision only.
  SERVER_IP: "192.168.77.219"
  SERVER_USER: "keepee"
  BACKEND_IMAGE_NAME: "backend"
  FRONTEND_IMAGE_NAME: "frontend"
  MCP_IMAGE_NAME: "mcp"
  EMBEDDING_IMAGE_NAME: "embedding"

# ── Test stage - gates build/deploy so broken code never reaches production ────

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn -q test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

test-frontend:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npx tsc --noEmit -p tsconfig.app.json
    - npm run test:run
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  # Note: `npm run lint` is intentionally NOT run here yet - the codebase has ~260
  # pre-existing eslint errors unrelated to this fix. Once those are cleaned up,
  # add `npm run lint` here too - it's the check that would have caught the
  # react-hooks/rules-of-hooks violation that caused React error #310 in VaultPage.

test-mcp:
  stage: test
  image: python:3.12-slim
  script:
    - cd mcp-server
    - pip install --no-cache-dir -r requirements.txt pytest
    - python -m pytest tests/ -q
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Build and push Docker images to GitLab Registry ────────────────────────────

build-backend:
  stage: build_and_push
  image: docker:29
  services:
    - docker:dind
  timeout: 60m
  retry: 2
  script:
    - echo "Pruning stale local Docker layer cache..."
    - docker system prune -af || true
    - echo "Building backend Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain --provenance=false --sbom=false -t ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ./backend
    - docker tag ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-frontend:
  stage: build_and_push
  image: docker:29
  services:
    - docker:dind
  timeout: 60m
  retry: 2
  script:
    - echo "Pruning stale local Docker layer cache..."
    - docker system prune -af || true
    - echo "Building frontend Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain --provenance=false --sbom=false -f ./frontend/Dockerfile.frontend -t ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-mcp:
  stage: build_and_push
  image: docker:29
  services:
    - docker:dind
  timeout: 30m
  retry: 2
  script:
    - echo "Pruning stale local Docker layer cache..."
    - docker system prune -af || true
    - echo "Building MCP server Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain --provenance=false --sbom=false -f ./Dockerfile.mcp -t ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# WIKI4AI-51: the embedding sidecar (Qwen3-Embedding-0.6B int8 ONNX) is built from
# ./embedding/Dockerfile — the same Dockerfile that produced the image previously
# built manually on .219 (verified 1:1: base python:3.11-slim, env, CMD, healthcheck;
# model artifact downloaded from HuggingFace at build time). Container RAM cap
# (2560m) lives in the stack compose file, not in the image — it is unaffected here.
build-embedding:
  stage: build_and_push
  image: docker:29
  services:
    - docker:dind
  timeout: 60m
  retry: 2
  script:
    - echo "Pruning stale local Docker layer cache..."
    - docker system prune -af || true
    - echo "Building embedding sidecar Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain --provenance=false --sbom=false -t ${IMAGE_REGISTRY}/${EMBEDDING_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ./embedding
    - docker tag ${IMAGE_REGISTRY}/${EMBEDDING_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${EMBEDDING_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${EMBEDDING_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${EMBEDDING_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy to dev server 192.168.77.219 (dockge stack wiki4ai) ────────────────
# WIKI4AI-52: the pipeline previously deployed to .177, where no wiki4ai stack
# runs. The real dev instance is the dockge stack on .219 — this job now:
#   1. backs up /mnt/data/docker/dockge/stacks/wiki4ai/compose.yaml,
#   2. re-points the image tags of backend/frontend/mcp/embedding to the commit
#      SHA (db and every other entry stay untouched),
#   3. pulls the four images from the registry and runs `docker compose up -d`,
#      which recreates only the services whose config changed.
# Production .4 is NEVER touched by the pipeline — deploying there is an
# explicit user decision only (see WORKFLOW.md §10).

deploy-to-server:
  stage: deploy-to-server
  image: alpine:latest
  timeout: 30m
  retry: 2
  needs:
    - build-backend
    - build-frontend
    - build-mcp
    - build-embedding
  script:
    - apk add --no-cache openssh-client
    # Devbox SSH key (CI variable WIKI4AI_DEPLOY_SSH_KEY_B64 = base64 of the
    # id_ed25519_devbox key). The job runs in a container on a shared runner, so
    # host files are not visible — the key is materialised from the variable.
    - echo "${WIKI4AI_DEPLOY_SSH_KEY_B64}" | base64 -d > /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - export DEPLOY_SSH="ssh -F /dev/null -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -i /tmp/deploy_key ${SERVER_USER}@${SERVER_IP}"
    - echo "Deploying commit ${CI_COMMIT_SHORT_SHA} to dev server ${SERVER_IP}..."
    # Backup the compose file before re-pointing image tags (rollback aid)
    - $DEPLOY_SSH "cp /mnt/data/docker/dockge/stacks/wiki4ai/compose.yaml /mnt/data/docker/dockge/stacks/wiki4ai/compose.yaml.bak-pipeline"
    # Re-point the four built services to the commit SHA; db + other entries untouched
    - $DEPLOY_SSH "sed -i -E 's#(git\.keepee\.duckdns\.org/services/wiki4ai/(backend|frontend|mcp|embedding):)[A-Za-z0-9._-]+#\1${CI_COMMIT_SHORT_SHA}#g' /mnt/data/docker/dockge/stacks/wiki4ai/compose.yaml"
    - $DEPLOY_SSH "grep -E 'image:' /mnt/data/docker/dockge/stacks/wiki4ai/compose.yaml"
    # Login to the GitLab registry on .219 and pull the four new images
    - echo "Logging into GitLab registry on ${SERVER_IP}..."
    - $DEPLOY_SSH "docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} git.keepee.duckdns.org"
    - $DEPLOY_SSH "docker pull ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - $DEPLOY_SSH "docker pull ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - $DEPLOY_SSH "docker pull ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - $DEPLOY_SSH "docker pull ${IMAGE_REGISTRY}/${EMBEDDING_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    # Recreate only the services whose image changed (db and friends stay up)
    - echo "Starting updated wiki4ai stack..."
    - $DEPLOY_SSH "cd /mnt/data/docker/dockge/stacks/wiki4ai && docker compose up -d"
    # Container status — db should still show its long uptime (untouched)
    - echo "Checking container status..."
    - $DEPLOY_SSH "cd /mnt/data/docker/dockge/stacks/wiki4ai && docker compose ps"
    - echo "Deployment to ${SERVER_IP} completed successfully!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
