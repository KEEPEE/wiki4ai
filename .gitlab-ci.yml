# wiki4ai - CI/CD Pipeline
# Build Docker images (backend + frontend + mcp) and push to GitLab Registry, then deploy to server

stages:
  - test
  - build_and_push
  - deploy-to-server

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_TLS_VERIFY: 1
  IMAGE_REGISTRY: git.keepee.duckdns.org/services/wiki4ai
  SERVER_IP: "192.168.77.177"
  SERVER_USER: "keepee"
  BACKEND_IMAGE_NAME: "backend"
  FRONTEND_IMAGE_NAME: "frontend"
  MCP_IMAGE_NAME: "mcp"

# ── Test stage - gates build/deploy so broken code never reaches production ────

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn -q test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

test-frontend:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npx tsc --noEmit -p tsconfig.app.json
    - npm run test:run
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  # Note: `npm run lint` is intentionally NOT run here yet - the codebase has ~260
  # pre-existing eslint errors unrelated to this fix. Once those are cleaned up,
  # add `npm run lint` here too - it's the check that would have caught the
  # react-hooks/rules-of-hooks violation that caused React error #310 in VaultPage.

test-mcp:
  stage: test
  image: python:3.12-slim
  script:
    - cd mcp-server
    - pip install --no-cache-dir -r requirements.txt pytest
    - python -m pytest tests/ -q
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Build and push Docker images to GitLab Registry ────────────────────────────

build-backend:
  stage: build_and_push
  image: docker:29
  services:
    - docker:dind
  timeout: 60m
  retry: 2
  script:
    - echo "Pruning stale local Docker layer cache..."
    - docker system prune -af || true
    - echo "Building backend Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain --provenance=false --sbom=false -t ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ./backend
    - docker tag ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-frontend:
  stage: build_and_push
  image: docker:29
  services:
    - docker:dind
  timeout: 60m
  retry: 2
  script:
    - echo "Pruning stale local Docker layer cache..."
    - docker system prune -af || true
    - echo "Building frontend Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain --provenance=false --sbom=false -f ./frontend/Dockerfile.frontend -t ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-mcp:
  stage: build_and_push
  image: docker:29
  services:
    - docker:dind
  timeout: 30m
  retry: 2
  script:
    - echo "Pruning stale local Docker layer cache..."
    - docker system prune -af || true
    - echo "Building MCP server Docker image..."
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build --no-cache --progress=plain --provenance=false --sbom=false -f ./Dockerfile.mcp -t ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:latest
    - docker push ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy to server 192.168.77.177 ───────────────────────────────────────────

deploy-to-server:
  stage: deploy-to-server
  image: alpine:latest
  timeout: 30m
  retry: 2
  needs:
    - build-backend
    - build-frontend
    - build-mcp
  script:
    - echo "Deploying to server ${SERVER_IP}..."
    - apk add --no-cache openssh-client sshpass
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${SERVER_IP} >> ~/.ssh/known_hosts
    # Create deployment directory on server
    - echo "Creating deployment directory on server..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "mkdir -p /home/keepee/docker/stacks/wiki4ai"
    # Replace IMAGE_TAG placeholder and transfer docker-compose.deploy.yml to server
    - echo "Transferring docker-compose.deploy.yml to server..."
    - sed "s/<IMAGE_TAG>/${CI_COMMIT_SHORT_SHA}/g" docker-compose.deploy.yml | sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "cat > /home/keepee/docker/stacks/wiki4ai/docker-compose.yml"
    # Login to GitLab registry on server and pull new images
    - echo "Logging into GitLab registry on server..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} git.keepee.duckdns.org"
    # Pull and tag backend image
    - echo "Pulling new backend image from GitLab registry..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker pull ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - echo "Tagging backend image as latest..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker tag ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${BACKEND_IMAGE_NAME}:latest"
    # Pull and tag frontend image
    - echo "Pulling new frontend image from GitLab registry..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker pull ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - echo "Tagging frontend image as latest..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker tag ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_NAME}:latest"
    # Pull and tag MCP image
    - echo "Pulling new MCP server image from GitLab registry..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker pull ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - echo "Tagging MCP image as latest..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker tag ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_REGISTRY}/${MCP_IMAGE_NAME}:latest"
    # Stop old containers and deploy with compose
    - echo "Stopping old wiki4ai containers..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker stop wiki4ai-backend wiki4ai-frontend wiki4ai-mcp || true"
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "docker rm wiki4ai-backend wiki4ai-frontend wiki4ai-mcp || true"
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "cd /home/keepee/docker/stacks/wiki4ai && docker compose down || true"
    - echo "Starting new wiki4ai stack..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "cd /home/keepee/docker/stacks/wiki4ai && docker compose up -d"
    # Check container status
    - echo "Checking container status..."
    - sshpass -p "${DEPLOY_SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} "cd /home/keepee/docker/stacks/wiki4ai && docker compose ps"
    - echo "Deployment completed successfully!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
