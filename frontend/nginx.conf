server {
    listen 80;
    server_name localhost;

    # WIKI4AI-71: Docker built-in DNS resolver. The proxy_pass directives below use
    # variables, so nginx resolves these hostnames per request (cached valid=10s)
    # instead of once at config load — a sidecar that restarts with a new IP
    # (docker stop/start, compose down/up) becomes reachable again without an
    # nginx reload. 127.0.0.11 is Docker's embedded DNS on user-defined networks.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WIKI4AI-71: upstream hostnames as variables (see resolver note above).
    # Every location below maps paths 1:1 (proxy_pass URI == location prefix), so
    # the variable form without a URI part passes the original request URI through
    # unchanged — behavior-identical to the previous static proxy_pass lines.
    set $backend_upstream http://backend:8080;
    set $kroki_upstream http://kroki:8000;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # React SPA routing — all non-API requests serve index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Add CORS headers for ES modules
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # WIKI4AI-39: never let browsers heuristically cache index.html (revalidate via ETag after deploys)
        add_header Cache-Control "no-cache" always;
    }

    # Proxy API requests to Spring Boot backend (v1 prefix).
    # WIKI4AI-64: `^~` makes this a preferential prefix — without it, the static
    # asset regex below (location ~* \.(png|jpg|...)$) wins over plain prefix
    # matching and intercepts /api/v1/images/{slug}/{uuid}.png with a 404 before
    # the request ever reaches the backend (e2e finding).
    location ^~ /api/v1 {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip Origin header so backend doesn't reject with 403 (backend has hardcoded CORS)
        proxy_set_header Origin "";
        proxy_set_header Referer $http_referer;
        proxy_buffering off;

        # Add CORS headers at nginx level for browser access on non-standard ports
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
    }

    # Swagger UI — proxy directly to backend
    location /swagger-ui/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PlantUML diagrams (WIKI4AI-63) — proxy to the self-hosted kroki service.
    # Kroki is a stateless diagram renderer in the same docker network; no host
    # port needed. GET /plantuml/svg/<deflate+base64url> → image/svg+xml.
    # WIKI4AI-71: variable-based proxy_pass + resolver above → per-request DNS
    # re-resolution, so a kroki restart with a new IP self-heals (no reload).
    # Path mapping stays 1:1: /plantuml/... arrives at kroki as /plantuml/...
    location /plantuml/ {
        proxy_pass $kroki_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /actuator/health {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Actuator endpoints (full path)
    location /actuator/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
